<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="600" fill="#222">1. Граф залежностей (варіант 1)</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="88" y="48" width="64" height="34" rx="6" fill="#3B82C4"/><text x="120" y="70" fill="#fff">A1</text>
    <rect x="88" y="118" width="64" height="34" rx="6" fill="#E8743B"/><text x="120" y="140" fill="#fff">A2</text>
    <rect x="228" y="83" width="64" height="34" rx="6" fill="#E8743B"/><text x="260" y="105" fill="#fff">B</text>
    <rect x="228" y="148" width="64" height="34" rx="6" fill="#3B82C4"/><text x="260" y="170" fill="#fff">C1</text>
    <rect x="368" y="83" width="64" height="34" rx="6" fill="#3B82C4"/><text x="400" y="105" fill="#fff">D1</text>
    <rect x="528" y="83" width="64" height="34" rx="6" fill="#3B82C4"/><text x="560" y="105" fill="#fff">C2</text>
    <rect x="668" y="83" width="64" height="34" rx="6" fill="#3B82C4"/><text x="700" y="105" fill="#fff">D2</text>
  </g>
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="152" y1="65" x2="226" y2="94"/>
    <line x1="152" y1="135" x2="226" y2="106"/>
    <line x1="292" y1="100" x2="366" y2="100"/>
    <line x1="292" y1="165" x2="366" y2="112"/>
    <line x1="592" y1="100" x2="666" y2="100"/>
  </g>
  <g font-size="12" fill="#333">
    <rect x="780" y="58" width="18" height="14" rx="3" fill="#E8743B"/><text x="806" y="70">повільне, 7 с</text>
    <rect x="780" y="84" width="18" height="14" rx="3" fill="#3B82C4"/><text x="806" y="96">швидке, 1 с</text>
    <line x1="780" y1="117" x2="798" y2="117" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/><text x="806" y="121">X → Y: Y залежить від X</text>
  </g>

  <text x="20" y="215" font-size="16" font-weight="600" fill="#222">2. Розподіл по потоках і точки синхронізації</text>

  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="150" y1="238" x2="150" y2="370"/><line x1="200" y1="238" x2="200" y2="370"/>
    <line x1="250" y1="238" x2="250" y2="370"/><line x1="300" y1="238" x2="300" y2="370"/>
    <line x1="350" y1="238" x2="350" y2="370"/><line x1="400" y1="238" x2="400" y2="370"/>
    <line x1="450" y1="238" x2="450" y2="370"/><line x1="500" y1="238" x2="500" y2="370"/>
    <line x1="550" y1="238" x2="550" y2="370"/><line x1="600" y1="238" x2="600" y2="370"/>
    <line x1="650" y1="238" x2="650" y2="370"/><line x1="700" y1="238" x2="700" y2="370"/>
    <line x1="750" y1="238" x2="750" y2="370"/><line x1="800" y1="238" x2="800" y2="370"/>
    <line x1="850" y1="238" x2="850" y2="370"/><line x1="900" y1="238" x2="900" y2="370"/>
  </g>

  <g font-size="13" fill="#222">
    <text x="20" y="268" font-weight="600">main</text><text x="20" y="284" font-size="11" fill="#666">головний потік</text>
    <text x="20" y="338" font-weight="600">T1</text><text x="20" y="354" font-size="11" fill="#666">std::async</text>
  </g>

  <g font-size="14" font-weight="600" text-anchor="middle" fill="#fff">
    <rect x="150" y="250" width="349" height="44" rx="4" fill="#E8743B"/><text x="325" y="277">A2 (7 с)</text>
    <rect x="501" y="250" width="348" height="44" rx="4" fill="#E8743B"/><text x="675" y="277">B (7 с)</text>
    <rect x="851" y="250" width="49" height="44" rx="4" fill="#3B82C4"/><text x="875" y="277">D1</text>

    <rect x="150" y="320" width="49" height="44" rx="4" fill="#3B82C4"/><text x="175" y="347">A1</text>
    <rect x="201" y="320" width="48" height="44" rx="4" fill="#3B82C4"/><text x="225" y="347">C1</text>
    <rect x="251" y="320" width="48" height="44" rx="4" fill="#3B82C4"/><text x="275" y="347">C2</text>
    <rect x="301" y="320" width="49" height="44" rx="4" fill="#3B82C4"/><text x="325" y="347">D2</text>
  </g>

  <path d="M140,294 L140,342 L148,342" stroke="#555" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>

  <path d="M350,342 L480,342 Q500,342 500,322 L500,297" stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
  <g font-size="11.5" fill="#C0392B" font-weight="600">
    <text x="512" y="340">t1.get() у t = 7: A1 (для B) і C1 (для D1)</text>
    <text x="512" y="355">готові ще з t = 4, тому чекати не треба</text>
  </g>
  <text x="906" y="277" font-size="11.5" fill="#555">Work is done!</text>

  <g font-size="12" fill="#444" text-anchor="middle">
    <line x1="150" y1="372" x2="900" y2="372" stroke="#444" stroke-width="1.2"/>
    <text x="150" y="388">0</text><text x="200" y="388">1</text><text x="250" y="388">2</text>
    <text x="300" y="388">3</text><text x="350" y="388">4</text><text x="400" y="388">5</text>
    <text x="450" y="388">6</text><text x="500" y="388">7</text><text x="550" y="388">8</text>
    <text x="600" y="388">9</text><text x="650" y="388">10</text><text x="700" y="388">11</text>
    <text x="750" y="388">12</text><text x="800" y="388">13</text><text x="850" y="388">14</text>
    <text x="900" y="388">15 с</text>
  </g>

  <text x="20" y="419" font-size="12" fill="#222">одночасно потоків</text>
  <rect x="150" y="404" width="200" height="22" fill="#F5D0BD"/>
  <rect x="350" y="404" width="550" height="22" fill="#D6E4F2"/>
  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="250" y="419">2</text><text x="625" y="419">1</text>
  </g>

  <text x="20" y="460" font-size="12" fill="#444">Загальний час 15 с (= критичний шлях A2+B+D1). Запусків потоків: 1. Максимум одночасно: 2 потоки, лише в [0; 4] с.</text>
</svg>
